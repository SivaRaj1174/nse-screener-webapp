<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ sector }} - Stock Details</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; background-color: #f8f9fa; }
        h1 { color: #1e293b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; border: 1px solid #cbd5e1; text-align: center; }
        th { background-color: #0f172a; color: white; }
        .buy { color: #16a34a; font-weight: bold; background-color: #f0fdf4; }
        .sell { color: #dc2626; font-weight: bold; background-color: #fef2f2; }
        .none { color: #64748b; }
        a { text-decoration: none; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Sector: {{ sector }}</h1>
    <table>
        <thead>
            <tr>
                <th>Stock Symbol</th>
                <th>Signal Status</th>
                <th>TradingView Chart</th>
            </tr>
        </thead>
        <tbody>
            {% for stock in stocks %}
            <tr>
                <td><b>{{ stock.symbol }}</b></td>
                <td class="{% if 'BUY' in stock.status %}buy{% elif 'SELL' in stock.status %}sell{% else %}none{% endif %}">
                    {{ stock.status }}
                </td>
                <td><a href="{{ stock.tv_link }}" target="_blank">View Chart 📈</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
